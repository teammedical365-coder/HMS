name: White-Label Android Build

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'Tenant ID'
        required: true
      hospitalName:
        description: 'Hospital Name'
        required: true
      applicationId:
        description: 'Android Application ID (e.g. com.medical365.xyz)'
        required: true
      logoUrl:
        description: 'URL of the Hospital Logo'
        required: true
      themeColor:
        description: 'Primary Theme Color Hex (e.g. #14b8a6)'
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update Capacitor Configuration
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const configPath = 'client/capacitor.config.json';
            const stringsPath = 'client/android/app/src/main/res/values/strings.xml';
            const gradlePath = 'client/android/app/build.gradle';
            
            const hospitalName = context.payload.inputs.hospitalName;
            const applicationId = context.payload.inputs.applicationId;
            
            if (fs.existsSync(configPath)) {
                let config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
                config.appName = hospitalName;
                config.appId = applicationId;
                // You can also inject backgroundColor/themeColor if using @capacitor/splash-screen
                fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
                console.log('Successfully updated capacitor.config.json with App Name:', hospitalName, 'and App ID:', applicationId);
            } else {
                console.error('capacitor.config.json not found at', configPath);
                process.exit(1);
            }
            
            // 1. Update strings.xml safely
            if (fs.existsSync(stringsPath)) {
                let xml = fs.readFileSync(stringsPath, 'utf8');
                xml = xml.replace(/(<string name="app_name">).*?(<\/string>)/, `$1${hospitalName}$2`);
                xml = xml.replace(/(<string name="title_activity_main">).*?(<\/string>)/, `$1${hospitalName}$2`);
                fs.writeFileSync(stringsPath, xml);
                console.log('Updated strings.xml');
            } else {
                console.log('strings.xml not found at', stringsPath);
            }
            
            // 2. Update build.gradle safely
            if (fs.existsSync(gradlePath)) {
                let gradle = fs.readFileSync(gradlePath, 'utf8');
                gradle = gradle.replace(/(applicationId\s+")([^"]+)(")/, `$1${applicationId}$3`);
                fs.writeFileSync(gradlePath, gradle);
                console.log('Updated build.gradle');
            } else {
                console.log('build.gradle not found at', gradlePath);
            }

      - name: Download & Process Logo
        run: |
          LOGO_URL="${{ github.event.inputs.logoUrl }}"
          # Check if the URL is relative (starts with /)
          if [[ "$LOGO_URL" == /* ]]; then
            LOGO_URL="https://hms-n6nk.onrender.com${LOGO_URL}"
          fi
          
          if [ "$LOGO_URL" != "default" ] && [ "$LOGO_URL" != "" ]; then
            echo "Downloading logo from $LOGO_URL"
            mkdir -p client/assets
            curl -f -L -s "$LOGO_URL" -o client/assets/icon.png || {
              echo "::error::Failed to download logo from URL: $LOGO_URL"
              exit 1
            }
          else
            echo "Using default logo"
          fi

      - name: Build Web App & Native Assets
        working-directory: ./client
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu
          
          # Install @capacitor/assets if not present
          npm install -D @capacitor/assets
          
          # Generate icons and splash screens safely
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          else
            echo "No custom icon.png found. Skipping asset generation."
          fi
          
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: ./client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Find and Move Artifacts
        run: |
          mkdir -p output_artifacts
          find client/android/app/build/outputs/apk/release -name "*.apk" -exec cp {} output_artifacts/app.apk \; || \
          find client/android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_artifacts/app.apk \;
          echo "Found APK:"
          ls -la output_artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-app-${{ github.event.inputs.tenantId }}
          path: output_artifacts/app.apk

      - name: Notify Backend Webhook (Success)
        if: success()
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WEBHOOK_SECRET="${{ secrets.GITHUB_WEBHOOK_SECRET || 'dev-secret-123' }}"
          
          curl -X POST "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github?secret=${WEBHOOK_SECRET}" \
               -H "Content-Type: application/json" \
               -d '{
                 "tenantId": "${{ github.event.inputs.tenantId }}",
                 "status": "COMPLETED",
                 "apkUrl": "'"$ARTIFACT_URL"'"
               }'

      - name: Notify Backend Webhook (Failure)
        if: failure()
        run: |
          WEBHOOK_SECRET="${{ secrets.GITHUB_WEBHOOK_SECRET || 'dev-secret-123' }}"
          
          curl -X POST "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github?secret=${WEBHOOK_SECRET}" \
               -H "Content-Type: application/json" \
               -d '{
                 "tenantId": "${{ github.event.inputs.tenantId }}",
                 "status": "FAILED",
                 "error": "GitHub Action workflow failed"
               }'