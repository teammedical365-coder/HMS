<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/assets/medical365fav.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical 365</title>
    
    <!-- PWA & iOS Add to Home Screen (Dynamic) -->
    <link rel="manifest" href="/api/public/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hospital" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Dynamic Branding Injector for iOS/Safari -->
    <script>
      (async function() {
        try {
          const response = await fetch('/api/public/manifest.json');
          if (response.ok) {
            const manifest = await response.json();
            
            // 1. Inject Theme Color dynamically
            if (manifest.theme_color) {
              let themeMeta = document.querySelector('meta[name="theme-color"]');
              if (themeMeta) themeMeta.setAttribute('content', manifest.theme_color);
            }
            
            // 2. Inject Apple Touch Icon dynamically
            if (manifest.icons && manifest.icons.length > 0) {
              const icon = manifest.icons.find(i => i.sizes === '192x192') || manifest.icons[0];
              if (icon && icon.src) {
                let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                if (appleIcon) appleIcon.setAttribute('href', icon.src);
              }
            }
            
            // 3. Inject Apple App Title
            if (manifest.short_name || manifest.name) {
              let titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
              if (titleMeta) titleMeta.setAttribute('content', manifest.short_name || manifest.name);
            }
          }
        } catch (error) {
          console.error('Failed to load dynamic PWA branding', error);
        }
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
