<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Safe Service Worker Purge for Local Development -->
  <script>
    (function () {
      try {
        var hostname = window.location.hostname;
        var port = window.location.port;
        var isLocalDev =
          hostname === 'localhost' ||
          hostname.endsWith('.localhost') ||
          hostname === '127.0.0.1' ||
          hostname.endsWith('.test') ||
          hostname.endsWith('.local') ||
          port === '5173' ||
          port === '5174' ||
          port === '3000';

        if (!isLocalDev || !('serviceWorker' in navigator)) return;

        function purgeDevServiceWorkers() {
          try {
            if (document.readyState === 'loading') return;
            var hadController = !!navigator.serviceWorker.controller;
            if (typeof navigator.serviceWorker.getRegistrations === 'function') {
              navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                  for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister().catch(function () {});
                  }
                })
                .catch(function () {});
            }
            if (typeof caches !== 'undefined' && typeof caches.keys === 'function') {
              caches.keys()
                .then(function (keys) {
                  keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
                })
                .catch(function () {});
            }
            if (hadController && !sessionStorage.getItem('__hms_sw_purged__')) {
              sessionStorage.setItem('__hms_sw_purged__', 'true');
              window.location.reload();
            }
          } catch (_) {}
        }

        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', purgeDevServiceWorkers, { once: true });
        } else {
          purgeDevServiceWorkers();
        }
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/jpeg" href="/assets/medical365fav.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical 365</title>

  <!-- Google Fonts: Outfit, Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- PWA & iOS Add to Home Screen (Dynamic) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14b8a6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hospital" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <!-- PWA Dynamic Branding -->
  <script>
    (async function() {
      try {
        const currentDomain = window.location.hostname;
        const exactOrigin = window.location.origin;
        
        const apiUrl = `/api/public/manifest.json?domain=${encodeURIComponent(currentDomain)}`;
        const response = await fetch(apiUrl);
        
        if (response.ok) {
          const manifest = await response.json();
          manifest.start_url = exactOrigin + '/';
          if (manifest.icons) {
            manifest.icons.forEach(icon => {
              if (icon.src && icon.src.startsWith('/')) {
                icon.src = exactOrigin + icon.src;
              } else if (icon.src && icon.src.includes('localhost')) {
                try {
                  const url = new URL(icon.src);
                  icon.src = exactOrigin + url.pathname;
                } catch (e) {}
              }
              if (icon.sizes === '192x192') icon.purpose = 'any';
            });
          }

          const manifestString = JSON.stringify(manifest);
          const manifestUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(manifestString);

          let manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.href = manifestUrl;
          }
        }
      } catch (error) {
        // Fallback static manifest is already in head
      }
    })();
  </script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Production-only PWA Service Worker Registration -->
  <script>
    (function () {
      const hostname = window.location.hostname;
      const port = window.location.port;
      const isLocalDev =
        hostname === 'localhost' ||
        hostname.endsWith('.localhost') ||
        hostname === '127.0.0.1' ||
        hostname.endsWith('.test') ||
        hostname.endsWith('.local') ||
        port === '5173' ||
        port === '5174' ||
        port === '3000';

      if (!isLocalDev && 'serviceWorker' in navigator) {
        var registerSW = function () {
          try {
            if (document.visibilityState === 'prerender') return;
            navigator.serviceWorker.register('/sw.js')
              .then(function () { console.log('Service Worker Registered!'); })
              .catch(function (err) { console.warn('SW registration skipped:', err && err.message ? err.message : err); });
          } catch (_) {}
        };
        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW, { once: true });
        }
      }
    })();
  </script>
</body>
