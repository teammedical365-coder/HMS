<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/assets/medical365fav.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical 365</title>

  <!-- Google Fonts: Outfit, Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- PWA & iOS Add to Home Screen (Dynamic) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14b8a6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hospital" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <!-- PWA Dynamic Branding -->
  <script>
    (async function() {
      try {
        const currentDomain = window.location.hostname;
        const exactOrigin = window.location.origin;
        
        const apiUrl = `/api/public/manifest.json?domain=${encodeURIComponent(currentDomain)}`;
        const response = await fetch(apiUrl);
        
        if (response.ok) {
          const manifest = await response.json();
          manifest.start_url = exactOrigin + '/';
          if (manifest.icons) {
            manifest.icons.forEach(icon => {
              if (icon.src && icon.src.startsWith('/')) icon.src = exactOrigin + icon.src;
              if (icon.sizes === '192x192') icon.purpose = 'any';
            });
          }

          const manifestString = JSON.stringify(manifest);
          const manifestUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(manifestString);

          let manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.href = manifestUrl;
          }
        }
      } catch (error) {
        // Fallback static manifest is already in head
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        // In local development, unregister any stale service workers and clear cache storage
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
        if (typeof caches !== 'undefined') {
          caches.keys().then((keys) => {
            keys.forEach((key) => caches.delete(key));
          });
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Service Worker Registered!'))
            .catch((err) => console.error('SW Error:', err));
        });
      }
    }
  </script>
</body>

</html>
