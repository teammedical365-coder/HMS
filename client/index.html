  <!-- Google Fonts: Outfit, Plus Jakarta Sans & JetBrains Mono -->

  <!-- PWA & iOS Add to Home Screen (Dynamic) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14b8a6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Dynamic Branding Injector for iOS/Safari -->
  <!-- Dynamic Branding Injector for PWA & iOS/Safari -->
<!-- PWA Dynamic Branding -->
    <script>
      (async function() {
        try {
          const currentDomain = window.location.hostname; // e.g., city-hospital.localhost
          const exactOrigin = window.location.origin; // e.g., http://city-hospital.localhost:5173
          
          // API se data mangwao
          const apiUrl = `https://hms-n6nk.onrender.com/api/public/manifest.json?domain=${currentDomain}`;
          const response = await fetch(apiUrl);
          
          if (response.ok) {
            const manifest = await response.json();
            
            // Chrome ke nakhre theek karne ke liye values overwrite karein
            manifest.start_url = exactOrigin + '/';
            if (manifest.icons) {
              manifest.icons.forEach(icon => {
                if (icon.src.startsWith('/')) icon.src = exactOrigin + icon.src;
                if (icon.sizes === '192x192') icon.purpose = 'any';
              });
            }

            // Virtual file bana kar browser ko do
            const manifestString = JSON.stringify(manifest);
            const manifestUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(manifestString);

            let manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestUrl;
            document.head.appendChild(manifestLink);
          }
        } catch (error) {
          console.error('Dynamic PWA Error:', error);
          // Agar API fail ho jaye, toh local manifest dikha do
          let fallbackLink = document.createElement('link');
          fallbackLink.rel = 'manifest';
          fallbackLink.href = '/manifest.json';
          document.head.appendChild(fallbackLink);
        }
      })();
    </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"

      corePlugins: {
        preflight: false,

  </script>

<body>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker Registered!'))
          .catch(err => console.error('SW Error:', err));
      });
    }
  </script>
